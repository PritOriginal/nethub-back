services:
  server:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: final
    container_name: nethub-back
    networks:
      - nethub-network
    ports:
      - ${SERVER_PORT}:${SERVER_PORT}
    depends_on:
      migrate:
        condition: service_completed_successfully
  postgres:
    image: postgres
    container_name: postgres-nethub
    restart: always
    user: postgres
    ports:
      - ${POSTGRES_PORT}:5432
    networks:
      - nethub-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
  migrate:
    image: migrate/migrate
    container_name: migrate-nethub
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nethub-network
    volumes:
      - ./migrations:/migrations
    command: ["-path", "/migrations/", "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}/${POSTGRES_DB}?sslmode=disable", "up"]

networks:
  nethub-network: